<div class="page">
    @if (clickedEvent) {
        <div class="container">
            <div class="event-wrapper">
                <span class="type">{{ clickedEvent.type }}</span>
                <div class="title">{{ clickedEvent.subTitle }}</div>
                <div class="desc">{{ clickedEvent.desc }}</div>
                <div class="info-wrapper">
                    <span>📅 {{ clickedEvent.longDate }}</span>
                    <span>▪</span>
                    <span>💻 {{ clickedEvent.mode }}</span>
                    <span>▪</span>
                    <span>🎓 {{ clickedEvent.programme }}</span>
                </div>
                <div class="fee-wrapper">
                    <div class="reg">Registration fee</div>
                    <div class="fee">{{ clickedEvent.regFee }}</div>
                </div>
            </div>
            <div class="form-wrapper">
                <div class="name-email">
                    <div class="name">
                        <label for="name">Full name</label>
                        <input type="text" placeholder="Your full name">
                    </div>
                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" placeholder="you@example.com">
                    </div>
                </div>
                <div class="institution">
                    <label for="institution">Institution</label>
                    <input type="text" placeholder="University / Organisation">
                </div>
                <div class="area">
                    <label for="research-area">Research area</label>
                    <input type="text" placeholder="e.g. Science Education">
                </div>
                <button>Continue to registration & payment →</button>
            </div>
        </div>
    } @else {
        <h3>Event Not Found</h3>
    }
</div>
